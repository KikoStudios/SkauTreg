name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.E2E_CONVEX_URL }}
      VERCEL_ENV: preview
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      CREDENTIAL_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ANALYTICS_ID_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      OAUTH_STATE_SECRET: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      NEXT_PUBLIC_LEGAL_OPERATOR_NAME: CI Operator
      NEXT_PUBLIC_LEGAL_OPERATOR_ADDRESS: CI Address 1
      NEXT_PUBLIC_PRIVACY_EMAIL: privacy@example.com
      NEXT_PUBLIC_SECURITY_EMAIL: security@example.com
      NEXT_PUBLIC_LEGAL_EFFECTIVE_DATE: 2026-07-25
      NEXT_PUBLIC_FEATURE_FINANCE: beta
      NEXT_PUBLIC_FEATURE_TRANSPORT_TICKETS: beta
      NEXT_PUBLIC_FEATURE_COLLABORATIVE_MEETINGS: beta
      NEXT_PUBLIC_FEATURE_FEEDBACK_HUB: beta
      APP_ORIGIN: https://ci.example.com
      NEXT_PUBLIC_STREDISKO_NAME: CI SkauTreg
      NEXT_PUBLIC_GMAIL_CLIENT_ID: ci-gmail-client-id
      NEXT_PUBLIC_GMAIL_OAUTH_VERIFICATION_STATUS: testing
      GMAIL_CLIENT_SECRET: ci-gmail-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:convex
      - run: npm run test:security
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run audit:prod
